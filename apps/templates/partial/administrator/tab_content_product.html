{% load static %}
<div class="container-xl">
    <div class="row">
      
      <div class="row">
        <div class="col-6 d-flex align-items-center">
          <h6 class="mb-0">Produk</h6>
        </div>
        <!-- <p class="text-xs ms-1 my-1">
          Last Updated : 21/12/2000
        </p> -->
        <div class="col-6 text-end">
          <a class="btn btn-primary mb-0" data-bs-toggle="modal"
          data-bs-target="#modal-product"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;&nbsp;Produk</a>
        </div>
      </div>
      <p class="text-xs">
        Last Updated : 21/12/2000
      </p>
          <div class="card-body px-0 pt-0 pb-2">
            <div class="table-responsive p-0">
              <table class="table align-items-center mb-0">
                <thead>
                  <tr>
                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Nama Product</th>
                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Deskripsi</th>
                    <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Harga</th>
                    <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Dibuat pada</th>
                    <th class="text-secondary opacity-7"></th>
                  </tr>
                </thead>
                <tbody id="product-collection">
                    {% for product in products %}
                        <tr>
                            <td data-name="{{product.product_name}}">
                            <div class="d-flex px-2 py-1">
                                <div>
                                <img src="{{ product.img_link }}" class="avatar avatar-sm me-3" alt="user1">
                                </div>
                                <div class="d-flex flex-column justify-content-center">
                                <h6 class="mb-0 text-sm">{{ product.product_name }}</h6>
                                </div>
                            </div>
                            </td>
                            <td>
                            <p class="text-sm font-weight-bold mb-0">{{ product.description }}</p>
                            </td>
                            <td class="align-middle text-center text-sm">
                            <p class="text-sm font-weight-bold mb-0">{{ product.price }}</p>
                            </td>
                            <td class="align-middle text-center">
                            <span class="text-secondary text-xs font-weight-bold">{{ product.created_at }}</span>
                            </td>
                            <td class="align-middle">
                            <a class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center align-items-center justify-content-center pointer remove-btn color-red pointer" data-id="{{ product.id }}">
                              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="remove-btn" data-id="{{ product.id }}">
                                <rect x="7" y="4" width="10" height="2" fill="red" rx="1" class="remove-btn" data-id="{{ product.id }}"/>
                                <path d="M9 4c0-.55.45-1 1-1h4c.55 0 1 .45 1 1v1H9V4z" fill="red" class="remove-btn" data-id="{{ product.id }}"/>
                                <path d="M6 7h12v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7z" fill="red" class="remove-btn" data-id="{{ product.id }}"/>
                                <path d="M10 10h1v8h-1v-8zm3 0h1v8h-1v-8z" fill="white" class="remove-btn" data-id="{{ product.id }}"/>
                              </svg>                              
                            </a>
                            </td>
                        </tr>                  
                    {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
    </div>
  </div>

{% include 'modal/upload_product.html' %}


<script>
    document.addEventListener('DOMContentLoaded', function () {

        
        
        document.getElementById('product-collection').addEventListener('click', function (event) {
            
            if (event.target.classList.contains('remove-btn')) {
                
                const productId = event.target.getAttribute('data-id');
                const productName = event.target.closest('tr').querySelector('td[data-name]').getAttribute('data-name');                

                if (confirm('Yakin ingin menghapus product ' + productName + '?')) {
                    const formData = new FormData();
                    formData.append('product-id', productId);

                    fetchManager.post(mLink.deleteProduct, formData)
                        .then(response => {
                            const message = response.data.msg;
                            if (response.status === true) {
                                alert(message);
                                window.location.href = mLink.menuContentManagement;
                            } else {
                                alert(message);
                            }
                            loading.hidden = true;
                        });
                }

            }
        });

    });
</script>
