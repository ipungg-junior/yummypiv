{% extends 'base/base_dashboard.html' %}

{% block sidenav %}
  {% include 'base/side_nav.html' %}
{% endblock sidenav %}

{% block body %}
      {% csrf_token %}
        
        <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
          
          <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl" id="navbarBlur" navbar-scroll="true">
            <div class="container-fluid py-1 px-3">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
                  <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="javascript:;">Pages</a></li>
                  <li class="breadcrumb-item text-sm text-dark active" aria-current="page">Dashboard</li>
                </ol>
                <h6 class="font-weight-bolder mb-0">Dashboard</h6>
              </nav>
              <div class="collapse navbar-collapse mt-sm-0 mt-2 me-md-0 me-sm-4" id="navbar">
                <ul class="navbar-nav  justify-content-end">
                  <li class="nav-item d-xl-none ps-3 d-flex align-items-center">
                    <a href="javascript:;" class="nav-link text-body p-0" id="iconNavbarSidenav">
                      <div class="sidenav-toggler-inner">
                        <i class="sidenav-toggler-line"></i>
                        <i class="sidenav-toggler-line"></i>
                        <i class="sidenav-toggler-line"></i>
                      </div>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>

          <div class="container-fluid py-4">
            <div class="row mt-4">
              
              <div class="col-lg-7">
                <div class="card z-index-2">
                  <div class="card-header pb-0">
                    <h6>Visitor Insight</h6>
                    <p class="text-sm">
                      <i class="fa fa-arrow-up text-success" aria-hidden="true"></i>
                      <span class="font-weight-bold">4% more</span> in 2021
                    </p>
                  </div>
                  <div class="card-body p-3">
                    <div class="chart">
                      <canvas id="chart-line" class="chart-canvas" height="900" style="display: block; box-sizing: border-box; height: 300px; width: 310px;" width="930"></canvas>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            {% include 'partial/administrator/footer.html' %}
          </div>
        </main>

        <script>
          var win = navigator.platform.indexOf('Win') > -1;
          if (win && document.querySelector('#sidenav-scrollbar')) {
            var options = {
              damping: '0.5'
            }
            Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
          }
        </script>

      <script>
        // @formatter:off
        const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
        document.addEventListener("DOMContentLoaded", function () {

          const formData = new FormData();
          formData.append('data-range', 'weekly');

          fetch('/api/visitor/', {  // Ganti '/upload/' dengan URL path Django Anda
            method: 'POST',
            body: formData,
            headers: {
              'X-CSRFToken': csrfToken,  // Untuk menambahkan CSRF token
            },
          })
            .then(response => response.json())
            .then(result => {
              if (result.status) {
                const data = result.data;

                // Pisahkan data menjadi array tanggal dan array jumlah pengunjung
                const dates = data.map(item => item.date);
                const visitorCounts = data.map(item => item.count);

                var ctx2 = document.getElementById("chart-line").getContext("2d");
      
          var gradientStroke1 = ctx2.createLinearGradient(0, 230, 0, 50);
      
          gradientStroke1.addColorStop(1, 'rgba(203,12,159,0.2)');
          gradientStroke1.addColorStop(0.2, 'rgba(72,72,176,0.0)');
          gradientStroke1.addColorStop(0, 'rgba(203,12,159,0)'); //purple colors
      
          var gradientStroke2 = ctx2.createLinearGradient(0, 230, 0, 50);
      
          gradientStroke2.addColorStop(1, 'rgba(20,23,39,0.2)');
          gradientStroke2.addColorStop(0.2, 'rgba(72,72,176,0.0)');
          gradientStroke2.addColorStop(0, 'rgba(20,23,39,0)'); //purple colors
      
          new Chart(ctx2, {
            type: "line",
            data: {
              labels: dates,
              datasets: [{
                  label: "Visitor",
                  tension: 0.4,
                  borderWidth: 0,
                  pointRadius: 0,
                  borderColor: "#cb0c9f",
                  borderWidth: 3,
                  backgroundColor: gradientStroke1,
                  fill: true,
                  data: visitorCounts,
                  maxBarThickness: 7
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  display: false,
                }
              },
              interaction: {
                intersect: false,
                mode: 'index',
              },
              scales: {
                y: {
                  grid: {
                    drawBorder: false,
                    display: true,
                    drawOnChartArea: true,
                    drawTicks: true,
                    borderDash: [5, 5]
                  },
                  ticks: {
                    display: true,
                    padding: 10,
                    font: {
                      size: 11,
                      family: "Inter",
                      style: 'normal',
                      lineHeight: 2
                    },
                    color: '#111111'
                  },
                },
                x: {
                  grid: {
                    drawBorder: false,
                    display: false,
                    drawOnChartArea: false,
                    drawTicks: false,
                    borderDash: [5, 5]
                  },
                  ticks: {
                    display: true,
                    padding: 20,
                    font: {
                      size: 11,
                      family: "Inter",
                      style: 'normal',
                      lineHeight: 2
                    },
                    color: '#111111'
                  },
                },
              },
            },
          });

              } else {
                console.error('Data status is false');
              }
            })
            .catch(error => console.error('Error fetching data:', error));

        });
        // @formatter:on
      </script>

{% endblock body %}
