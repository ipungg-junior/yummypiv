{% load static %}
<div class="modal modal-blur fade" id="modal-testimonial" aria-hidden="true">
    {% csrf_token %}
    <div class="modal-dialog modal-md" role="document">
        <form id="testimonial-form" data-endpoint="{% url 'api-add-testimonial' %}">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Testimonial</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="testimonial_form_customer">Customer Name</label>
                        <input type="text" class="form-control" name="testimonial-customer" id="testimonial_form_customer" placeholder="Enter customer name" value="" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="testimonial_form_profile">Profile Image</label>
                        <img src="" class="w-100 h-100 object-cover card-img-end mb-2" id="testimonial_form_profile_preview" hidden>
                        <input type="file" accept="image/png, image/jpeg, image/webp, image/jpg" class="form-control" name="testimonial-image" id="testimonial_form_profile">
                        <div class="form-text">Maximum file size: 8MB</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="testimonial_form_banner">Banner Image</label>
                        <img src="" class="w-100 h-100 object-cover card-img-end mb-2" id="testimonial_form_banner_preview" hidden>
                        <input type="file" accept="image/png, image/jpeg, image/webp, image/jpg" class="form-control" name="testimonial-banner-image" id="testimonial_form_banner">
                        <div class="form-text">Optional banner image</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="testimonial_form_content">Testimonial Content</label>
                        <textarea class="form-control" name="testimonial-content" id="testimonial_form_content" placeholder="Enter testimonial content" rows="3" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal" id="testimonial_form_close">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary ms-auto" id="testimonial_form_submit">
                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                        Save
                    </button>
                </div>
            </div>
        </form>
        <div class="progress progress-md d-none" id="testimonial_form_loading">
            <div class="progress-bar progress-bar-indeterminate"></div>
        </div>
    </div>

    <script src="{% static 'js/async-form-handler.js' %}"></script>
    <script>
        // Initialize AsyncFormHandler for testimonial form
        document.addEventListener('DOMContentLoaded', function () {
            const testimonialForm = new AsyncFormHandler({
                form: '#testimonial-form',
                endpoint: document.getElementById('testimonial-form').dataset.endpoint,
                submitButton: '#testimonial_form_submit',
                loadingClass: 'loading',
                onSuccess: function (result, response) {
                    // Close modal and reload page
                    const modal = bootstrap.Modal.getInstance(document.getElementById('modal-testimonial'));
                    modal.hide();

                    // Show success message
                    if (result.message) {
                        alert(result.message);
                    }

                    // Reload the page to show new testimonial
                    window.location.reload();
                },
                onError: function (result, response) {
                    // Error handling is done automatically by AsyncFormHandler
                    console.error('Testimonial form error:', result);
                }
            });

            // Image preview functionality for profile image
            const profileInput = document.getElementById('testimonial_form_profile');
            const profilePreview = document.getElementById('testimonial_form_profile_preview');

            profileInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                const maxSize = 8 * 1024 * 1024; // 8MB

                if (file) {
                    if (file.size > maxSize) {
                        alert('Ukuran gambar tidak boleh lebih dari 8MB.');
                        this.value = '';
                        profilePreview.src = '';
                        profilePreview.hidden = true;
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        profilePreview.src = e.target.result;
                        profilePreview.hidden = false;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Image preview functionality for banner image
            const bannerInput = document.getElementById('testimonial_form_banner');
            const bannerPreview = document.getElementById('testimonial_form_banner_preview');

            bannerInput.addEventListener('change', function (event) {
                const file = event.target.files[0];

                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        bannerPreview.src = e.target.result;
                        bannerPreview.hidden = false;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Reset form when modal is closed
            document.getElementById('testimonial_form_close').addEventListener('click', function () {
                profileInput.value = '';
                profilePreview.src = '';
                profilePreview.hidden = true;
                bannerInput.value = '';
                bannerPreview.src = '';
                bannerPreview.hidden = true;
            });

            // Also reset when modal is hidden
            document.getElementById('modal-testimonial').addEventListener('hidden.bs.modal', function () {
                profileInput.value = '';
                profilePreview.src = '';
                profilePreview.hidden = true;
                bannerInput.value = '';
                bannerPreview.src = '';
                bannerPreview.hidden = true;
            });
        });
    </script>

</div>
